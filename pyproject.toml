[project]
name = "automation-ops-hub"
version = "1.0.0"
description = "Workflow orchestration, webhook automation, scheduling, audit logs, and execution analytics"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["F"]
